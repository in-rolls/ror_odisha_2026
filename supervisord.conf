[unix_http_server]
file=%(here)s/logs/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/logs/supervisor.log
pidfile=%(here)s/logs/supervisor.pid
childlogdir=%(here)s/logs
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[program:crawl]
command=/bin/bash %(here)s/crawl.sh
directory=%(here)s
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/logs/crawl-service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:audit]
command=%(here)s/.venv/bin/python %(here)s/crawl_health.py --watch
directory=%(here)s
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/logs/audit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
